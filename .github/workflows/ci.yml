name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build + Tests (Maven)
        run: mvn -B clean verify

  docker-build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Builder l'image Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-management:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/product-management:latest .

      - name: Pousser l'image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-management --all-tags

